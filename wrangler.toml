name = "kaigisiken"
pages_build_output_dir = "public"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

# パスキー認証・個人データ同期用の KV ネームスペース。
#   作成:  npx wrangler kv namespace create KAIGI_KV
#   出力された id を下に貼り付ける。
[[kv_namespaces]]
binding = "KAIGI_KV"
id = "88ac39dfd8ad4c8691502743d7e6830b"

# シークレットはコミットせず、ダッシュボードまたは CLI で設定:
#   npx wrangler pages secret put SESSION_SECRET
#   npx wrangler pages secret put OPENAI_API_KEY        # ← codex-everywhere で発行したAPIキー
#   npx wrangler pages secret put SYNC_TOKEN            # ← ロードマップ同期(npm run sync)用の任意トークン
# 非シークレット（識別子・エンドポイント等）は [vars] に置く:
[vars]
AI_PROVIDER = "openai-responses"
OPENAI_BASE_URL = "https://codex-everywhere.com"
AI_MODEL = "gpt-5.5"
# AI_REASONING_EFFORT = "medium"   # gpt-5.5 の思考量（low/medium/high）。未指定ならモデル既定
